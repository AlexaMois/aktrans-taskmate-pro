name: Deploy to Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Supabase Edge Functions
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - name: Install Supabase CLI
        run: |
          curl -sL https://github.com/supabase/cli/releases/download/v1.123.4/supabase_1.123.4_linux_amd64.tar.gz | tar xz
          sudo mv supabase /usr/local/bin/
          supabase --version
      
      - name: Deploy meetings-bot function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: hvsighjpcycwoqpmuvga
        run: |
          supabase functions deploy meetings-bot \
            --project-ref $SUPABASE_PROJECT_ID \
            --no-verify-jwt
      
      - name: Deployment complete
        run: |
          echo "✅ meetings-bot function deployed successfully!"
          echo "View logs: https://supabase.com/dashboard/project/hvsighjpcycwoqpmuvga/functions/meetings-bot/logs"
